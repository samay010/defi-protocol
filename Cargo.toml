[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/adapter-aave",
    "crates/chain",
    "crates/adapter-compound",
    "crates/rpc",
    "crates/strategies",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Third-party dependencies are listed per crate; each needs an ADR (see docs/adr).
# See docs/adr/0003-std-only-first-release.md
