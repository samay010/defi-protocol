# cargo-deny configuration (best effort; run `cargo deny check`, adjust to your cargo-deny version).
[advisories]
yanked = "deny"

[licenses]
# only licenses actually present are listed; add one when a new dependency needs it
allow = ["Apache-2.0", "MIT"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true   # workspace path deps (crates are publish = false)

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
