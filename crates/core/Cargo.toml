[package]
name = "protocol-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Core engine: manifests, risk engine, execution engine, supervisor, external-strategy runtime"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
toml = "1.2.2"

# Linux only: the seccomp deny-list applied inside the sandbox (src/seccomp.rs).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
seccompiler = { version = "0.5", default-features = false }
