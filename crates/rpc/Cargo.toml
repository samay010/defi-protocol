[package]
name = "protocol-rpc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Read-only HTTPS JSON-RPC transport (alloy) for the Aave adapter: eth_call only, testnets only"

[dependencies]
protocol-adapter-aave = { path = "../adapter-aave" }

# default-features = false on purpose: alloy's defaults include a local signer and contract
# helpers. This crate must be unable to sign or send anything. See ADR 0013.
alloy = { version = "2.4", default-features = false, features = [
    "std",
    "network",
    "providers",
    "provider-http",
    "reqwest-rustls-tls",
    "rpc-types-eth",
] }
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
