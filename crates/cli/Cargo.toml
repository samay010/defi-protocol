[package]
name = "protocol-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The `protocol` command-line interface"

[lib]
name = "protocol_cli"
path = "src/lib.rs"

[[bin]]
name = "protocol"
path = "src/main.rs"

[dependencies]
protocol-core = { path = "../core" }
protocol-adapter-aave = { path = "../adapter-aave" }
protocol-strategies = { path = "../strategies" }
clap = { version = "4.6.9", features = ["derive"] }
protocol-rpc = { path = "../rpc" }
